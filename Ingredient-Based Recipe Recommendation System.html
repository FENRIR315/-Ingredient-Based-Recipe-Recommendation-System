    // ============================================================
    //  2. MATCHING ENGINE
    // ============================================================
    // ALGORITHM OVERVIEW:
    //  1. Normalize the user's pantry into a Set of lowercased strings.
    //  2. For each recipe, separate ingredients into required vs optional.
    //  3. Compute a weighted score:
    //       - Required match rate  → 85% of total score
    //         (penalizes missing critical ingredients heavily)
    //       - Optional match rate  → 15% of total score
    //         (bonus for having extras, no penalty if missing)
    //  4. Return: score %, lists of matched/missing for both categories.
    // ============================================================

    function normalize(str) {
      return str.toLowerCase().trim();
    }

    function calculateMatch(pantry, recipe) {
      const pantrySet = new Set(pantry.map(normalize));

      const required = recipe.ingredients.filter(function(i) { return !i.optional; });
      const optional = recipe.ingredients.filter(function(i) { return i.optional; });

      var matchedRequired = required.filter(function(i) { return pantrySet.has(normalize(i.name)); });
      var missingRequired = required.filter(function(i) { return !pantrySet.has(normalize(i.name)); });
      var matchedOptional = optional.filter(function(i) { return pantrySet.has(normalize(i.name)); });
      var missingOptional = optional.filter(function(i) { return !pantrySet.has(normalize(i.name)); });

      var reqScore = required.length > 0 ? (matchedRequired.length / required.length) * 85 : 85;
      var optScore = optional.length > 0 ? (matchedOptional.length / optional.length) * 15 : 15;
      var totalScore = Math.round(reqScore + optScore);

      return {
        score: totalScore,
        matchedRequired: matchedRequired,
        missingRequired: missingRequired,
        matchedOptional: matchedOptional,
        missingOptional: missingOptional
      };
    }

                React.createElement("div", { className: "min-w-0" },
                  React.createElement("h3", { className: "text-base sm:text-lg font-semibold text-gray-800 dark:text-gray-100 truncate" }, recipe.name),
                  React.createElement("div", { className: "flex items-center gap-2 mt-0.5" },
                    React.createElement("span", { className: "text-xs px-2 py-0.5 rounded-full capitalize font-medium " + getDiffColor() },
                      recipe.difficulty
                    ),
                    React.createElement("span", { className: "text-xs text-gray-400 dark:text-gray-500" },
                      "\u23F1 ", recipe.cookTime, " min"
                    )
                  )
                )
              ),
              React.createElement("div", {
                className: "text-lg font-bold px-3 py-1 rounded-lg border-2 shrink-0 ml-2 " + getScoreColor()
              }, match.score, "%")
            ),

            // Ingredients grid
            React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3" },
              // You Have column
              React.createElement("div", null,
                React.createElement("h4", { className: "text-xs font-semibold text-green-700 dark:text-green-400 uppercase tracking-wide mb-1.5 flex items-center gap-1" },
                  React.createElement("span", { className: "text-green-600 dark:text-green-400" }, "\u2713"),
                  "You Have (", allMatched.length, ")"
                ),
                React.createElement("ul", { className: "space-y-1" },
                  allMatched.length > 0
                    ? allMatched.map(function(item, i) {
                        return React.createElement("li", {
                          key: i,
                          className: "text-sm text-green-700 dark:text-green-400 flex items-center gap-1"
                        },
                          React.createElement("span", { className: "text-green-500 dark:text-green-400 shrink-0" }, "\u2713"),
                          item.name
                        );
                      })
                    : React.createElement("li", { className: "text-sm text-gray-300 dark:text-gray-600 italic" }, "None yet")
                )
              ),

              // Missing column
              React.createElement("div", null,
                React.createElement("h4", { className: "text-xs font-semibold uppercase tracking-wide mb-1.5 flex items-center gap-1 " +
                  (allMissing.length === 0 ? "text-green-600 dark:text-green-400" : "text-amber-600 dark:text-amber-400")
                },
                  React.createElement("span", null, allMissing.length === 0 ? "\u2713" : "\u26A0"),
                  allMissing.length === 0 ? "Complete!" : "Missing (" + allMissing.length + ")"
                ),
                React.createElement("ul", { className: "space-y-1" },
                  match.missingRequired.map(function(item, i) {
                    return React.createElement("li", {
                      key: "req-" + i,
                      className: "text-sm text-amber-600 dark:text-amber-400 flex items-center gap-1"
                    },
                      React.createElement("span", { className: "text-amber-500 dark:text-amber-400 shrink-0" }, "\u26A0"),
                      item.name,
                      React.createElement("span", { className: "text-xs text-amber-400 dark:text-amber-500 ml-auto" }, "(required)")
                    );
                  }),
                  match.missingOptional.map(function(item, i) {
                    return React.createElement("li", {
                      key: "opt-" + i,
                      className: "text-sm text-gray-400 dark:text-gray-500 flex items-center gap-1"
                    },
                      React.createElement("span", { className: "text-gray-300 dark:text-gray-600 shrink-0" }, "\u25CB"),
                      item.name,
                      React.createElement("span", { className: "text-xs text-gray-300 dark:text-gray-600 ml-auto" }, "(optional)")
                    );
                  }),
                  allMissing.length === 0 &&
                    React.createElement("li", { className: "text-sm text-green-600 dark:text-green-400 font-medium" },
                      "\uD83C\uDF89 You have everything needed!"
                    )
                )
              )
            ),

            // Collapsible instructions
            React.createElement("details", { className: "group" },
              React.createElement("summary", {
                className: "flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 cursor-pointer py-1 select-none"
              },
                React.createElement("span", { className: "transition-transform group-open:rotate-90" }, "\u25B6"),
                "Instructions (", recipe.instructions.length, " steps)"
              ),
              React.createElement("ol", { className: "mt-2 space-y-1.5 list-decimal list-inside text-sm text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-gray-900/50 rounded-lg p-3" },
                recipe.instructions.map(function(step, i) {
                  return React.createElement("li", { key: i }, step);
                })
              )
            )
          )
        )
      );
    }


    function RecommendationDashboard(props) {
      var recipes = props.recipes;
      var pantry = props.pantry;

      // Memoize the matching computation so it only recalculates when pantry or recipes change
      var matchedRecipes = React.useMemo(function() {
        return recipes
          .map(function(r) {
            return { recipe: r, match: calculateMatch(pantry, r) };
          })
          .filter(function(item) { return item.match.score > 0; })
          .sort(function(a, b) { return b.match.score - a.match.score; });
      }, [pantry, recipes]);

      // Empty pantry state
      if (pantry.length === 0) {
        return (
          React.createElement("div", { className: "text-center py-16 px-4" },
            React.createElement("span", { className: "text-6xl block mb-4" }, "\uD83C\uDF7D\uFE0F"),
            React.createElement("h2", { className: "text-xl font-semibold text-gray-800 dark:text-gray-100 mb-1" },
              "Add some ingredients to get started!"
            ),
            React.createElement("p", { className: "text-sm text-gray-400 dark:text-gray-500 max-w-md mx-auto" },
              "Type ingredients you have in your pantry above or use the quick-add buttons. I'll find recipes you can make."
            )
          )
        );
      }

      // No matches state
      if (matchedRecipes.length === 0) {
        return (
          React.createElement("div", { className: "text-center py-16 px-4" },
            React.createElement("span", { className: "text-6xl block mb-4" }, "\uD83E\uDD37\u200D\u2642\uFE0F"),
            React.createElement("h2", { className: "text-xl font-semibold text-gray-800 dark:text-gray-100 mb-1" },
              "No matching recipes found"
            ),
            React.createElement("p", { className: "text-sm text-gray-400 dark:text-gray-500 max-w-md mx-auto" },
              "Try adding more ingredients \u2014 with 54 recipes available, there's bound to be something you can make!"
            )
          )
        );
      }

      return (
        React.createElement("div", null,
          React.createElement("div", { className: "flex items-center justify-between mb-3" },
            React.createElement("h2", { className: "text-lg font-semibold text-gray-800 dark:text-gray-100" },
              "\uD83C\uDFC6 Recipe Recommendations",
              React.createElement("span", { className: "text-sm font-normal text-gray-400 dark:text-gray-500 ml-2" },
                "(", matchedRecipes.length, " found)"
              )
            )
          ),
          React.createElement("div", { className: "space-y-3" },
            matchedRecipes.map(function(item) {
              return React.createElement(RecipeCard, {
                key: item.recipe.id,
                recipe: item.recipe,
                match: item.match
              });
            })
          )
        )
      );
    }


    function GrocerySidebar(props) {
      var recipes = props.recipes;
      var pantry = props.pantry;

      var checklistState = React.useState(function() { return loadChecklist(); });
      var checkedItems = checklistState[0];
      var setCheckedItems = checklistState[1];

      React.useEffect(function() {
        saveChecklist(checkedItems);
      }, [checkedItems]);

      // Compute top 3 matched recipes and aggregate missing required ingredients
      var missingItems = React.useMemo(function() {
        if (pantry.length === 0) return [];
        var scored = recipes
          .map(function(r) { return { recipe: r, match: calculateMatch(pantry, r) }; })
          .filter(function(item) { return item.match.score > 0; })
          .sort(function(a, b) { return b.match.score - a.match.score; });
        var top3 = scored.slice(0, 3);
        var seen = {};
        var result = [];
        top3.forEach(function(item) {
          item.match.missingRequired.forEach(function(ing) {
            var key = ing.name.toLowerCase();
            if (!seen[key]) {
              seen[key] = true;
              result.push(ing.name);
            }
          });
        });
        return result;
      }, [pantry, recipes]);

      function toggleItem(item) {
        setCheckedItems(function(prev) {
          var copy = Object.assign({}, prev);
          copy[item] = !copy[item];
          return copy;
        });
      }

      // Container classes for mobile vs desktop
      return (
        React.createElement("div", { className: "lg:w-80 shrink-0" },
          React.createElement("div", { className: "bg-white dark:bg-gray-800 rounded-xl shadow-md dark:shadow-gray-900/30 p-4 sm:p-5" },
            React.createElement("div", { className: "flex items-center gap-2 mb-4" },
              React.createElement("span", { className: "text-xl" }, "\uD83D\uDED2"),
              React.createElement("h2", { className: "text-lg font-semibold text-gray-800 dark:text-gray-100" }, "Grocery List")
            ),

            // Empty states
            pantry.length === 0
              ? React.createElement("p", { className: "text-sm text-gray-400 dark:text-gray-500 text-center py-4" },
                  "Add some ingredients to generate a grocery list."
                )
              : missingItems.length === 0
                ? React.createElement("div", { className: "text-center py-6" },
                    React.createElement("span", { className: "text-3xl block mb-2" }, "\uD83C\uDF89"),
                    React.createElement("p", { className: "text-sm text-green-600 dark:text-green-400 font-medium" },
                      "No missing ingredients!"
                    ),
                    React.createElement("p", { className: "text-xs text-gray-400 dark:text-gray-500 mt-1" },
                      "You have everything needed for your top recipes."
                    )
                  )
                : React.createElement("div", null,
                    React.createElement("p", { className: "text-xs text-gray-400 dark:text-gray-500 mb-3" },
                      "Missing required ingredients from your top 3 recommended recipes:"
                    ),
                    React.createElement("ul", { className: "space-y-2" },
                      missingItems.map(function(item) {
                        var checked = !!checkedItems[item];
                        return React.createElement("li", {
                          key: item,
                          className: "flex items-center gap-2 group"
                        },
                          React.createElement("input", {
                            type: "checkbox",
                            checked: checked,
                            onChange: function() { toggleItem(item); },
                            className: "w-4 h-4 text-green-600 dark:text-green-500 border-gray-300 dark:border-gray-600 rounded focus:ring-green-500 cursor-pointer bg-white dark:bg-gray-700"
                          }),
                          React.createElement("span", {
                            className: "text-sm cursor-pointer select-none " +
                              (checked ? "line-through text-gray-400 dark:text-gray-600" : "text-gray-700 dark:text-gray-200")
                          }, item)
                        );
                      })
                    ),
                    React.createElement("p", { className: "text-xs text-gray-400 dark:text-gray-500 mt-3 pt-3 border-t border-gray-100 dark:border-gray-700" },
                      "\u2714 Check items off as you shop"
                    )
                  )
          )
        )
      );
    }


    // ============================================================
    //  5. APP & RENDER
    // ============================================================

    function App() {
      var pantryState = React.useState(function() { return loadPantry(); });
      var pantry = pantryState[0];
      var setPantry = pantryState[1];

      var darkState = React.useState(function() {
        try { return localStorage.getItem('smartplate_darkmode') === 'true'; } catch(e) { return false; }
      });
      var darkMode = darkState[0];
      var setDarkMode = darkState[1];

      function toggleDarkMode() {
        setDarkMode(function(prev) {
          var next = !prev;
          try { localStorage.setItem('smartplate_darkmode', next); } catch(e) {}
          if (next) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          return next;
        });
      }

      React.useEffect(function() {
        savePantry(pantry);
      }, [pantry]);

      return (
        React.createElement("div", { className: "min-h-screen bg-gray-50 dark:bg-gray-950" },
          React.createElement(Header, { darkMode: darkMode, toggleDarkMode: toggleDarkMode }),
          React.createElement("main", { className: "max-w-7xl mx-auto px-4 py-5" },
            React.createElement(PantrySection, {
              pantry: pantry,
              setPantry: setPantry
            }),
            React.createElement("div", { className: "flex flex-col lg:flex-row gap-5 mt-5" },
              React.createElement("div", { className: "flex-1 min-w-0" },
                React.createElement(RecommendationDashboard, {
                  recipes: RECIPES,
                  pantry: pantry
                })
              ),
              React.createElement(GrocerySidebar, {
                recipes: RECIPES,
                pantry: pantry
              })
            )
          )
        )
      );
    }

    var root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
